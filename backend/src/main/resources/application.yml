server:
  port: 8080

spring:
  application:
    name: backend
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:resource_center}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      validation-timeout: 5000
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.baluga.backend.modules
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: true
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

baluga:
  storage:
    upload-dir: ${BALUGA_UPLOAD_DIR:}
  ai:
    matching:
      provider: openai
      openai-api-key: ${DEEPSEEK_API_KEY:}
      openai-base-url: https://api.deepseek.com/v1
      openai-model: deepseek-chat
      max-tokens: 4096
      temperature: 0.1
      timeout-seconds: 120
      max-retries: 2
      max-candidates-per-resource: 3


logging:
  level:
    root: info
    com.baluga.backend: info
